<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام حجز واستقبال العملاء الذكي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 600px;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    /* زر الواتساب */
    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 20px;
      background-color: #25D366;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 12px;
      margin-bottom: 25px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }

    .whatsapp-btn:hover {
      background-color: #1da851;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
    }

    .whatsapp-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-container {
      display: inline-block;
      margin-bottom: 15px;
    }

    .logo-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
      background-color: #000;
      display: block;
      margin: 0 auto;
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #e2e8f0;
    }

    .form-group input, 
    .form-group select, 
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #fff;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus, 
    .form-group select:focus, 
    .form-group textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .form-row {
      display: flex;
      gap: 15px;
    }

    .form-row .form-group {
      flex: 1;
    }

    /* حقل فخ البوتات (Honeypot) - إخفاء تام */
    .hp-field {
      display: none !important;
      visibility: hidden !important;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
      margin-top: 10px;
    }

    button[type="submit"]:hover {
      background: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.6);
    }

    button[type="submit"]:disabled {
      background: #475569;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    select option {
      background: #1e293b;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- زر تواصل عبر الواتساب فوق النموذج -->
    <a href="https://wa.me/201111383748" target="_blank" class="whatsapp-btn">
      <svg viewBox="0 0 24 24">

      </svg>
      تواصل معنا مباشرة عبر الواتساب
    </a>

    <div class="brand-header">
      <div class="logo-container">
        <img 
          src="logo.png" 
          alt="شعار النظام" 
          class="logo-img"
          onerror="if (this.src.indexOf('logo.png.png') == -1) this.src='logo.png.png';"
        >
      </div>
      <h2>نظام حجز واستقبال العملاء</h2>
      <p class="subtitle">املأ نموذج الحجز أدناه، وسيتم تأكيد موعدك فوراً</p>
    </div>

    <form id="bookingForm">
      
      <!-- فخ البوتات (Honeypot) -->
      <div class="hp-field">
        <label for="website">موقعك الإلكتروني</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <!-- الاسم -->
      <div class="form-group">
        <label for="name">الاسم بالكامل *</label>
        <input type="text" id="name" name="name" required placeholder="أدخل اسمك الكريم">
      </div>

      <!-- رقم الهاتف والإيميل -->
      <div class="form-row">
        <div class="form-group">
          <label for="phone">رقم الهاتف *</label>
          <input type="tel" id="phone" name="phone" required placeholder="01xxxxxxxxx">
        </div>
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" placeholder="example@domain.com">
        </div>
      </div>

      <!-- الخدمة المطلوبة -->
      <div class="form-group">
        <label for="service">الخدمة المطلوبة *</label>
        <select id="service" name="service" required>
          <option value="" disabled selected>اختر الخدمة المناسبة...</option>
          <option value="استشارة تقنية">استشارة تقنية</option>
          <option value="حجز موعد خدمة">حجز موعد خدمة</option>
          <option value="دعم فني واستقبال">دعم فني واستقبال</option>
        </select>
      </div>

      <!-- التاريخ والوقت -->
      <div class="form-row">
        <div class="form-group">
          <label for="date">التاريخ المطلوب *</label>
          <input type="date" id="date" name="date" required>
        </div>
        <div class="form-group">
          <label for="time">الوقت المفضل *</label>
          <input type="time" id="time" name="time" required>
        </div>
      </div>

      <!-- ملاحظات -->
      <div class="form-group">
        <label for="notes">ملاحظات إضافية</label>
        <textarea id="notes" name="notes" rows="3" placeholder="اكتب أي تفاصيل أخرى ترغب في إضافتها..."></textarea>
      </div>

      <!-- زر الإرسال -->
      <button type="submit">تأكيد وإرسال الحجز</button>
    </form>
  </div>

  <script>
  // 1. منع الضغط على الزر الأيمن للموس
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // 2. منع اختصارات لوحة التحكم الخاصة بالمطورين (F12, Ctrl+Shift+I, Ctrl+U)
  document.onkeydown = function(e) {
    if (e.keyCode == 123) { // F12
      return false;
    }
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { // Ctrl+Shift+I
      return false;
    }
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { // Ctrl+Shift+C
      return false;
    }
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { // Ctrl+Shift+J
      return false;
    }
    if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { // Ctrl+U (عرض المصدر)
      return false;
    }
  };
</script>
