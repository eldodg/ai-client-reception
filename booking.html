<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUTOOM (ATOM) | نظام الحجز والاستقبال الذكي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-deep: #030712;
      --bg-card: rgba(13, 22, 40, 0.75);
      --border-cyan: rgba(0, 210, 255, 0.25);
      --accent-cyan: #00d2ff;
      --accent-blue: #0066ff;
      --text-main: #f8fafc;
      --text-muted: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.18) 0%, transparent 65%),
        radial-gradient(circle at 85% 85%, rgba(0, 102, 255, 0.12) 0%, transparent 55%),
        linear-gradient(rgba(0, 210, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 210, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 25px 15px;
    }

    .container {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-cyan);
      width: 100%;
      max-width: 620px;
      padding: 40px 35px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 210, 255, 0.1);
      position: relative;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
      border-radius: 24px 24px 0 0;
    }

    /* زر التواصل السريع عبر الواتساب */
    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 20px;
      background: rgba(37, 211, 102, 0.12);
      border: 1px solid rgba(37, 211, 102, 0.4);
      color: #25D366;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.98rem;
      border-radius: 12px;
      margin-bottom: 28px;
      transition: all 0.3s ease;
    }

    .whatsapp-btn:hover {
      background: #25D366;
      color: #000;
      box-shadow: 0 0 20px rgba(37, 211, 102, 0.5);
      transform: translateY(-2px);
    }

    .whatsapp-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* هيدر الشعار والبراند */
    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-container {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }

    .logo-img {
      height: 80px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 14px rgba(0, 210, 255, 0.7));
    }

    /* كلمة ATOM بالطابع الإعلاني الاحترافي */
    .brand-promo-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: #ffffff;
      text-shadow: 0 0 15px var(--accent-cyan), 0 0 30px var(--accent-blue);
      margin-top: 8px;
    }

    .brand-tagline {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: var(--accent-cyan);
      margin-top: 2px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    /* عناصر النموذج */
    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.92rem;
      color: #e2e8f0;
    }

    .form-group input, 
    .form-group select, 
    .form-group textarea {
      width: 100%;
      padding: 13px 16px;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 12px;
      font-size: 0.95rem;
      color: #fff;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus, 
    .form-group select:focus, 
    .form-group textarea:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.25);
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .hp-field {
      display: none !important;
      visibility: hidden !important;
    }

    button[type="submit"] {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-cyan) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.08rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 210, 255, 0.4);
      margin-top: 10px;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(0, 210, 255, 0.7);
    }

    button[type="submit"]:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    select option {
      background: #030712;
      color: #fff;
    }

    @media (max-width: 500px) {
      .container { padding: 30px 20px; }
      .form-row { flex-direction: column; gap: 0; }
      .brand-promo-title { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- زر التواصل السريع عبر الواتساب -->
    <a href="https://wa.me/201111383748" target="_blank" class="whatsapp-btn">
      <svg viewBox="0 0 24 24">
        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
      </svg>
      تواصل مباشر عبر الواتساب
    </a>

    <div class="brand-header">
      <div class="logo-container">
        <!-- تم توجيه الصورة هنا لتقرأ logo1.png -->
        <img src="logo1.png" alt="AUTOOM Logo" class="logo-img" onerror="if (this.src.indexOf('logo1.png.png') == -1) this.src='logo1.png.png';">
        
        <div class="brand-promo-title">ATOM</div>
        <div class="brand-tagline">AUTOMATION × AI × INNOVATION</div>
      </div>
      <h2>نظام الحجز والاستقبال الآلي</h2>
      <p class="subtitle">قم بتعبئة بيانات الطلب أدناه وسيقوم النظام بأتمتة معالجتها فوراً</p>
    </div>

    <form id="bookingForm">
      
      <!-- Honeypot -->
      <div class="hp-field">
        <label for="website">موقعك الإلكتروني</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <!-- الاسم -->
      <div class="form-group">
        <label for="name">الاسم بالكامل *</label>
        <input type="text" id="name" name="name" required placeholder="أدخل اسمك الكريم">
      </div>

      <!-- الهاتف والبريد -->
      <div class="form-row">
        <div class="form-group">
          <label for="phone">رقم الهاتف *</label>
          <input type="tel" id="phone" name="phone" required placeholder="01xxxxxxxxx">
        </div>
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" placeholder="example@domain.com">
        </div>
      </div>

      <!-- الخدمة المطلوبة -->
      <div class="form-group">
        <label for="service">الخدمة المطلوبة *</label>
        <select id="service" name="service" required>
          <option value="" disabled selected>اختر الخدمة المناسبة...</option>
          <option value="أنظمة الأتمتة والحجز الذكي">أنظمة الأتمتة والحجز الذكي (AI Automation)</option>
          <option value="كاميرات المراقبة والأمان الذكي">كاميرات المراقبة والأمان الذكي (CCTV & Security)</option>
          <option value="تطوير المواقع والتطبيقات">تطوير المواقع والتطبيقات (Web & Mobile Apps)</option>
          <option value="عقود صيانة الأجهزة الإلكترونية">عقود صيانة الأجهزة واللوحات الإلكترونية</option>
          <option value="إدارة السيرفرات والبنية السحابية">إدارة السيرفرات والبنية السحابية (Cloud Infrastructure)</option>
          <option value="استشارات وأمان البنية التحتية">استشارات وأمان البنية التحتية البرمجية (IT Security)</option>
          <option value="خدمة أخرى / طلب مخصص">خدمة أخرى / طلب مخصص (Other Service)</option>
        </select>
      </div>

      <!-- التاريخ والوقت -->
      <div class="form-row">
        <div class="form-group">
          <label for="date">التاريخ المطلوب *</label>
          <input type="date" id="date" name="date" required>
        </div>
        <div class="form-group">
          <label for="time">الوقت المفضل *</label>
          <input type="time" id="time" name="time" required>
        </div>
      </div>

      <!-- ملاحظات -->
      <div class="form-group">
        <label for="notes">ملاحظات إضافية</label>
        <textarea id="notes" name="notes" rows="3" placeholder="اكتب أي تفاصيل أخرى أو متطلبات خاصة بالخدمة..."></textarea>
      </div>

      <!-- زر الإرسال -->
      <button type="submit">تأكيد وإرسال الطلب عبر النظام</button>
    </form>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyGTZGyn9W6BwgL4ecgiLluAYmzeW_fBnufXaPRA2wQsptl0pA3rE44vESJsIVQZrCYMw/exec';

    const form = document.getElementById('bookingForm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = form.querySelector('button[type="submit"]');
      const originalText = btn.textContent;
      
      btn.disabled = true;
      btn.textContent = 'جاري معالجة وإرسال الطلب آلياً...';

      try {
        const formData = new FormData(form);
        const params = new URLSearchParams(formData);

        await fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: params.toString()
        });

        alert('تم استلام طلبك بنجاح وسيتواصل معك مهندس النظام فوراً!');
        form.reset();
      } catch (err) {
        alert('حدث خطأ أثناء معالجة الطلب، يرجى المحاولة لاحقاً أو التواصل معنا مباشرة عبر الواتساب.');
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });

    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });

    document.onkeydown = function(e) {
      if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
        return false;
      }
    };
  </script>
</body>
</html>
