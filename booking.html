<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTOOM (ATOM) | الحجز</title>
<link rel="stylesheet" href="atom.css">
</head>
<body data-page="booking">
<main class="wrap sec">
  <div class="split">
    <section data-orbit>
      <span class="live"><i></i><span data-i18n="live"></span></span>
      <h1 class="h1" style="margin-top:24px" data-i18n="h1"></h1>
      <p class="lead" data-i18n="sub"></p>
      <ul class="facts">
        <li><span data-i18n="k1"></span><b data-i18n="v1"></b></li>
        <li><span data-i18n="k2"></span><b data-i18n="v2"></b></li>
        <li><span data-i18n="k3"></span><b data-i18n="v3"></b></li>
      </ul>
      <p style="margin-top:28px"><a class="btn ghost" id="waBtn" target="_blank" rel="noopener" data-i18n="wa"></a></p>
      <p class="lead" style="font-size:.9rem;margin-top:14px" data-i18n="waNote"></p>
    </section>

    <section>
      <form id="bookingForm" class="f" novalidate>
        <div class="hp" aria-hidden="true"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
        <div><label for="name" data-i18n="lName"></label><input id="name" name="name" required maxlength="80" autocomplete="name"></div>
        <div class="row">
          <div><label for="phone" data-i18n="lPhone"></label><input id="phone" name="phone" type="tel" required maxlength="20" placeholder="01xxxxxxxxx" autocomplete="tel"></div>
          <div><label for="email" data-i18n="lEmail"></label><input id="email" name="email" type="email" maxlength="120" placeholder="name@domain.com" autocomplete="email"></div>
        </div>
        <div><label for="service" data-i18n="lService"></label><select id="service" name="service" required></select></div>
        <div><label for="plan" data-i18n="lPlan"></label><select id="plan" name="plan"></select></div>
        <div class="row">
          <div><label for="date" data-i18n="lDate"></label><input id="date" name="date" type="date" required></div>
          <div><label for="time" data-i18n="lTime"></label><input id="time" name="time" type="time" required></div>
        </div>
        <div><label for="notes" data-i18n="lNotes"></label><textarea id="notes" name="notes" rows="3" maxlength="600"></textarea></div>
        <div class="chk"><input type="checkbox" id="agree" required><label for="agree" data-i18n-html="agree"></label></div>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <button class="btn" type="submit" id="btn" data-i18n="submit"></button>
      </form>

      <div class="done" id="done" hidden>
        <h2 data-i18n="doneT"></h2>
        <p class="lead" style="margin-top:12px" data-i18n="doneS"></p>
        <div class="ref"><span data-i18n="ref"></span><b id="refId"></b></div>
        <a class="btn ghost" href="index.html" data-i18n="home"></a>
      </div>
    </section>
  </div>
</main>

<script>
/* ضع هنا رابط Web App الخاص بـ Google Apps Script بعد النشر */
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGTZGyn9W6BwgL4ecgiLluAYmzeW_fBnufXaPRA2wQsptl0pA3rE44vESJsIVQZrCYMw/exec";

var SERVICES = [
  ["أنظمة الأتمتة والحجز الذكي", "AI Automation & Smart Booking"],
  ["منظومة التقييمات الذكية وإدارة السمعة", "Smart Review Funnel"],
  ["كاميرات المراقبة والأمان الذكي", "CCTV & Smart Security"],
  ["تطوير المواقع والتطبيقات", "Web & Mobile Development"],
  ["عقود صيانة الأجهزة الإلكترونية", "Electronics Maintenance Contracts"],
  ["إدارة السيرفرات والبنية السحابية", "Server & Cloud Management"],
  ["استشارات وأمان البنية التحتية", "IT Security Consulting"],
  ["خدمة أخرى / طلب مخصص", "Other / Custom request"]
];
var PLANS = [
  ["بدون باقة محددة / استشارة عامة", "No specific plan / general consultation"],
  ["الباقة الأساسية", "Basic plan"],
  ["الباقة المتقدمة", "Advanced plan"],
  ["باقة التقييمات وإدارة السمعة", "Review Funnel plan"],
  ["باقة الصيانة الشهرية", "Monthly maintenance plan"]
];

window.I18N = {
ar: { title: "AUTOOM (ATOM) | الحجز", live: "نظام الاستقبال يعمل الآن",
  h1: "احجز موعدك. النظام يتولى الباقي.",
  sub: "املأ الطلب ليُسجَّل فوراً في جدول المواعيد ويصلنا إشعار مباشر، دون انتظار رد يدوي.",
  k1: "التوفر", v1: "24/7", k2: "التسجيل", v2: "فوري في Google Sheets", k3: "التنبيه", v3: "Telegram و WhatsApp",
  wa: "تواصل عبر واتساب", waNote: "خلف الأتمتة فريق حقيقي يرد عليك على واتساب.",
  lName: "الاسم بالكامل *", lPhone: "رقم الهاتف *", lEmail: "البريد الإلكتروني", lService: "الخدمة المطلوبة *",
  lPlan: "الباقة (اختياري)", lDate: "التاريخ *", lTime: "الوقت المفضل *", lNotes: "ملاحظات",
  agree: 'أوافق على <a href="terms.html" target="_blank">الشروط والأحكام وسياسة الخصوصية</a> *',
  submit: "إرسال الطلب", choose: "اختر الخدمة...",
  badPhone: "رقم الهاتف غير صالح.", fast: "تم الإرسال بسرعة كبيرة. حاول مرة أخرى.", required: "أكمل الحقول المطلوبة ووافق على الشروط.",
  sending: "جارٍ الإرسال...", taken: "هذا الموعد محجوز. اختر وقتاً آخر.", rate: "تجاوزت عدد المحاولات. حاول لاحقاً أو تواصل عبر واتساب.",
  fail: "تعذر الإرسال. حاول مجدداً أو تواصل عبر واتساب.",
  doneT: "تم استلام طلبك", doneS: "سجّلنا طلبك وسيتواصل معك فريقنا لتأكيد الموعد.", ref: "رقم المرجع", home: "العودة للرئيسية" },
en: { title: "AUTOOM (ATOM) | Booking", live: "Intake system online",
  h1: "Book a slot. The system handles the rest.",
  sub: "Fill in the request. It is logged to our schedule instantly and we are notified, with no waiting for a manual reply.",
  k1: "Availability", v1: "24/7", k2: "Logging", v2: "Instant to Google Sheets", k3: "Alerts", v3: "Telegram and WhatsApp",
  wa: "Contact on WhatsApp", waNote: "A real team stands behind the automation and replies on WhatsApp.",
  lName: "Full name *", lPhone: "Phone *", lEmail: "Email", lService: "Service *",
  lPlan: "Plan (optional)", lDate: "Date *", lTime: "Preferred time *", lNotes: "Notes",
  agree: 'I agree to the <a href="terms.html" target="_blank">Terms, Conditions and Privacy Policy</a> *',
  submit: "Send request", choose: "Choose a service...",
  badPhone: "Invalid phone number.", fast: "Sent too quickly. Please try again.", required: "Complete the required fields and accept the terms.",
  sending: "Sending...", taken: "That slot is taken. Choose another time.", rate: "Too many attempts. Try later or contact us on WhatsApp.",
  fail: "Could not send. Try again or contact us on WhatsApp.",
  doneT: "Request received", doneS: "Your request is logged. Our team will contact you to confirm the slot.", ref: "Reference", home: "Back to home" }
};

var form = document.getElementById("bookingForm"), msg = document.getElementById("msg"), btn = document.getElementById("btn");
var t0 = Date.now();
var qs = new URLSearchParams(location.search);
var firstRun = true;
form.date.min = new Date().toISOString().slice(0, 10);
function fill(sel, list, l, placeholder) {
  var keep = sel.value;
  sel.innerHTML = "";
  if (placeholder) { var o = new Option(placeholder, ""); o.disabled = true; o.selected = true; sel.add(o); }
  list.forEach(function (x) { sel.add(new Option(x[l === "ar" ? 0 : 1], x[0])); });
  if (keep) sel.value = keep;
}
window.onLang = function (l) {
  document.getElementById("waBtn").href = "https://wa.me/" + ATOM.wa;
  fill(form.service, SERVICES, l, ATOM.t("choose"));
  fill(form.plan, PLANS, l);
  if (firstRun) {
    firstRun = false;
    var p = qs.get("plan"), s = qs.get("service");
    if (p === "basic") form.plan.value = PLANS[1][0];
    if (p === "advanced") form.plan.value = PLANS[2][0];
    if (s === "review") { form.service.value = SERVICES[1][0]; form.plan.value = PLANS[3][0]; }
  }
};

function say(k, err) { msg.textContent = ATOM.t(k); msg.className = "msg" + (err ? " err" : ""); }

form.addEventListener("submit", function (e) {
  e.preventDefault();
  if (form.website.value) return;                       // honeypot
  if (!form.checkValidity()) { say("required", true); form.reportValidity(); return; }
  var phone = form.phone.value.replace(/[\s-]/g, "");
  if (!/^\+?\d{8,15}$/.test(phone)) { say("badPhone", true); return; }
  var spent = Date.now() - t0;
  if (spent < 3000) { say("fast", true); return; }

  btn.disabled = true; say("sending");
  var body = {
    name: form.name.value, phone: phone, email: form.email.value, service: form.service.value,
    plan: form.plan.value, date: form.date.value, time: form.time.value, notes: form.notes.value,
    lang: ATOM.lang(), t: spent, website: ""
  };
  fetch(APPS_SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.ok) {
        form.hidden = true;
        document.getElementById("refId").textContent = j.id;
        document.getElementById("done").hidden = false;
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else if (j.error === "slot_taken") say("taken", true);
      else if (j.error === "rate_limited") say("rate", true);
      else say("fail", true);
    })
    .catch(function () { say("fail", true); })
    .then(function () { btn.disabled = false; });
});
</script>
<script src="atom.js"></script>
</body>
</html>
